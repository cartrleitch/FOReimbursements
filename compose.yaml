services:
  client:
    build: 
      context: ./rs25-client/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
    - .env

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: churchdb
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

  server:
    build: 
      context: .
      dockerfile: RS25/Dockerfile  
    ports:
      - "5000:8080"
    volumes:
      - ./RS25/Uploads:/app/Uploads
    depends_on:
      db:
        condition: service_healthy
    env_file: 
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=churchdb;Username=postgres;Password=${POSTGRES_PASSWORD}

volumes:
  postgres_data:
  uploads:
