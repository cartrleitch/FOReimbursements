services:
  client:
    build: 
      context: .
      dockerfile: rs25-client/Dockerfile
    ports:
      - "3000:3000"

  server:
    build: 
      context: .
      dockerfile: RS25/Dockerfile  
    ports:
      - "5000:80"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=churchreimdb;Username=postgres;Password=research25

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: research25
      POSTGRES_DB: churchdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
